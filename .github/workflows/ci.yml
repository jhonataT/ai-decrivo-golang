name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # No Windows o Wails compila sem cgo, então não precisa instalar GTK/WebKit.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: templ generate
        run: go tool templ generate

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build -tags desktop,production -o decrivo.exe .
